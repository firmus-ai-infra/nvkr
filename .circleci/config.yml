# Customer-owned CircleCI config. NVKR does not generate this file.
# This pipeline builds one artifact: the Ubuntu 24.04.5 ARM64 node QCOW2.
# build_node_image starts that job. publish_node_image uploads the disk and
# does not start a job by itself. The job refuses uid 0. Its last step restores
# owner write on its directories, then deletes the working directory on success
# and on failure. NVKR registry publication stays out.
version: 2.1

parameters:
  # Build and record the Ubuntu 24.04.5 ARM64 node image.
  build_node_image:
    type: boolean
    default: true
  # Upload the node-image disk. This step runs only inside node-os-image.
  publish_node_image:
    type: boolean
    default: true

executors:
  node-image:
    machine: true
    resource_class: firmus/arm64-native

jobs:
  build-node-os-image:
    executor: node-image
    environment:
      S3_ENDPOINT: https://s3-console.cbr01.in.firmus.co/
      S3_BUCKET: nvke
      S3_PREFIX: nvke-node-image-ubuntu24-arm64
      UBUNTU_SERIES: "24.04.5"
    steps:
      - checkout
      - run:
          name: Admit the native KVM host
          command: |
            set -euo pipefail
            if [ "$(id -u)" = "0" ]; then
              echo "the node image job must run as a non-root account" >&2
              exit 1
            fi
            case "$(uname -m)" in
              aarch64|arm64) ;;
              *)
                echo "the Ubuntu 24 node image is linux/arm64 and needs an arm64 machine" >&2
                exit 1
                ;;
            esac
            if ! docker info >/dev/null 2>&1; then
              echo "docker is not available" >&2
              exit 1
            fi
            if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
              echo "runner identity needs read/write access to /dev/kvm" >&2
              exit 1
            fi
            exec 3<>/dev/kvm
            exec 3>&-
            command -v jq >/dev/null
            command -v mc >/dev/null
            avail_kib="$(df -Pk . | awk 'NR==2 { print $4 }')"
            case "${avail_kib}" in
              ''|*[!0-9]*)
                echo "could not read free workspace space" >&2
                exit 1
                ;;
            esac
            if [ "${avail_kib}" -lt 67108864 ]; then
              echo "need at least 64 GiB free workspace, found ${avail_kib} KiB" >&2
              exit 1
            fi
      - run:
          name: Build the Ubuntu 24 node image
          no_output_timeout: 120m
          command: |
            set -euo pipefail
            unset GITHUB_ACTIONS
            if [ -z "${CIRCLE_BUILD_NUM:-}" ]; then
              echo "CIRCLE_BUILD_NUM is required for the attempt name" >&2
              exit 1
            fi
            NVKE_OS_UBUNTU_VERSION=24.04 NVKE_OS_ARCH=arm64 \
              scripts/nvke-os-local-harbor.sh "circleci-${CIRCLE_BUILD_NUM}" 4
      - run:
          name: Record the disk digest
          command: |
            set -euo pipefail
            if [ -z "${CIRCLE_BUILD_NUM:-}" ]; then
              echo "CIRCLE_BUILD_NUM is required for the build record" >&2
              exit 1
            fi
            attempt="circleci-${CIRCLE_BUILD_NUM}"
            outdir=".nvkr/runs/${attempt}/outputs"
            qcow="${outdir}/nvke-node-image-ubuntu24-arm64.qcow2"
            test -f "${qcow}"
            (
              cd "${outdir}"
              sha256sum "$(basename "${qcow}")" > "$(basename "${qcow}").sha256"
              sha256sum -c "$(basename "${qcow}").sha256"
            )
            digest="$(awk '{ print $1 }' "${qcow}.sha256")"
            case "${digest}" in
              *[!0-9a-f]*|"")
                echo "disk checksum is not a hex digest" >&2
                exit 1
                ;;
            esac
            if [ "${#digest}" -ne 64 ]; then
              echo "disk checksum is not a SHA-256 digest" >&2
              exit 1
            fi
            size="$(stat -c %s "${qcow}")"
            printf 'attempt: %s\nbuild_number: %s\nsize: %s\ndigest: sha256:%s\n' \
              "${attempt}" "${CIRCLE_BUILD_NUM}" "${size}" "${digest}" \
              > "${outdir}/build-info.txt"
            test -f ".nvkr/runs/${attempt}/lifecycle.json"
      - when:
          condition: << pipeline.parameters.publish_node_image >>
          steps:
            - run:
                name: Publish the node image
                command: |
                  set -euo pipefail
                  scripts/push-node-image-s3.sh \
                    ".nvkr/runs/circleci-${CIRCLE_BUILD_NUM}/outputs/nvke-node-image-ubuntu24-arm64.qcow2"
      - run:
          name: Stage the digest and attempt record
          command: |
            set -euo pipefail
            attempt="circleci-${CIRCLE_BUILD_NUM}"
            outdir=".nvkr/runs/${attempt}/outputs"
            # Stage inside this job's working directory. The runner keeps /tmp
            # between jobs, so a shared /tmp path can hold files this user cannot write.
            dest="nvkr-node-image-meta"
            mkdir -p "${dest}"
            cp "${outdir}/nvke-node-image-ubuntu24-arm64.qcow2.sha256" "${dest}/"
            cp "${outdir}/build-info.txt" "${dest}/"
            cp ".nvkr/runs/${attempt}/lifecycle.json" "${dest}/"
      - store_artifacts:
          path: nvkr-node-image-meta
          destination: node-image
      - run:
          name: Delete the job working directory
          when: always
          command: |
            set -euo pipefail
            case "${PWD}" in
              /*) ;;
              *)
                echo "workspace path is not absolute" >&2
                exit 1
                ;;
            esac
            if [ "${PWD}" = "/" ]; then
              echo "refusing to clean the host root" >&2
              exit 1
            fi
            uid="$(id -u)"
            gid="$(id -g)"
            if [ "${uid}" = "0" ]; then
              echo "refusing to clean the workspace as root" >&2
              exit 1
            fi
            # Unlink needs owner write on the parent. Sealed directories are
            # mode 0555 or 0500 and are still owned by this account. Restore
            # owner rwx on those directories only. -type d does not follow
            # symlinks or change file modes. Do not change ownership.
            find "${PWD}" -xdev -user "${uid}" -group "${gid}" -type d \
              -exec chmod u+rwx {} + || true
            # Delete only what this account owns. -delete implies -depth, so a
            # directory is removed after its owned children. A foreign entry
            # stays behind and fails the check below.
            find "${PWD}" -xdev -mindepth 1 -user "${uid}" -group "${gid}" -delete || true
            remaining="$(find "${PWD}" -xdev -mindepth 1 -print)"
            if [ -n "${remaining}" ]; then
              printf '%s\n' "${remaining}" | head -n 20 >&2 || true
              echo "workspace still contains files this account cannot delete" >&2
              exit 1
            fi

workflows:
  node-os-image:
    when: << pipeline.parameters.build_node_image >>
    jobs:
      # nico-harbor supplies S3_ACCESS_KEY and S3_SECRET_KEY. The job does not print them.
      - build-node-os-image:
          context: [nico-harbor]
